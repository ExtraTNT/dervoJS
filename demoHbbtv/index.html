<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dervoJS HbbTV demo</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin:0; padding:0; overflow-x:hidden; }

      /* generic focusable: just a transition hook for the active state */
      .focusable        { transition: background 150ms, box-shadow 150ms, border-color 150ms; }
      .focusable-active { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }

      /* lists */
      .focus-list      { gap: 6px; }
      .focus-list-item {
        padding: 10px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .focus-list-item.focusable-active { background: var(--surface-2); }

      /* grids */
      .focus-grid      { gap: 10px; }
      .focus-grid-cell {
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        text-align: center;
        font-weight: 600;
      }
      .focus-grid-cell.focusable-active { background: var(--surface-2); }

      /* scroll containers */
      .focusable-scroll {
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      /* tabs */
      .tab-bar { gap: 8px; padding: 4px; align-items: center; }
      .tab {
        padding: 5px 14px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .tab-active { background: var(--accent); color: #fff; }
      /* Override the default inside outline with a halo for the small pill */
      .tab.focusable-active {
        outline: none;
        box-shadow: 0 0 0 3px var(--accent), 0 0 0 5px rgba(255,255,255,0.15);
      }
    </style>
  </head>
  <body>
    <!--
      HbbTV / OIPF DOM hooks. Real STBs instantiate these by type; desktop
      browsers ignore them.
    -->
    <object id="appmgr"  type="application/oipfApplicationManager"
            style="position:absolute; left:-9999px; top:-9999px; width:0; height:0"></object>
    <object id="oipfcfg" type="application/oipfConfiguration"
            style="position:absolute; left:-9999px; top:-9999px; width:0; height:0"></object>
    <object id="video"   type="video/broadcast"
            style="position:absolute; left:-9999px; top:-9999px; width:0; height:0; z-index:-1"></object>

    <script type="module" src="./main.js"></script>
  </body>
</html>
