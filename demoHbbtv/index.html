<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html PUBLIC "-//HbbTV//1.1.1//EN" "http://www.hbbtv.org/dtd/HbbTV-1.1.1.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dervoJS HbbTV demo</title>
    <link rel="stylesheet" href="./custom.css" />
    <link rel="stylesheet" href="../src/dervo.css" />
  </head>
  <body>
    <!--
      HbbTV / OIPF DOM hooks. Real STBs instantiate these by type; desktop
      browsers ignore them.
    -->
    <object id="appmgr"  type="application/oipfApplicationManager"
            style="position:absolute; left:-9999px; top:-9999px; width:0; height:0"></object>
    <object id="oipfcfg" type="application/oipfConfiguration"
            style="position:absolute; left:-9999px; top:-9999px; width:0; height:0"></object>
    <object id="video"   type="video/broadcast"
            style="position:absolute; left:-9999px; top:-9999px; width:0; height:0; z-index:-1"></object>
    <script type="module" src="./main.js"></script>
  </body>
</html>
